<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi gym</title>
<meta name="description" content="Registro de entrenamiento y seguimiento de progreso.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link href="fonts.css" rel="stylesheet">
<style>
/* Un solo tema, siempre oscuro: el modo claro se fue entero.
   El fondo es negro de verdad (#000) y no gris oscuro, por tres motivos: es lo que
   pidió Lucas, la pantalla del iPhone es OLED y el negro puro no gasta batería, y
   en el gimnasio con luz fuerte las tarjetas se recortan mejor contra el negro.
   Los acentos están bajados de saturación para que no griten sobre fondo negro. */
:root{
  /* Sobre negro puro una tarjeta gris oscuro casi no se despega del fondo, así que
     --surface está más arriba de lo que parece y además las tarjetas llevan borde.
     Medido: tarjeta contra fondo da 1.5 y todo el texto pasa 5:1. */
  --bg:#000000; --surface:#171D24; --ink:#E7ECF1; --muted:#8A95A1;
  --line:#2A323B; --equip:#49535D; --celeste:#4E9BDC; --plate:#C9963C; --done:#3DA876; --warn:#D1753F;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1,h2,.sets,nav button{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800}
header h1{font-size:clamp(2.4rem,9vw,3.6rem);line-height:.95;margin:8px 0 6px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);max-width:52ch}
.sync{font-size:.8rem;color:var(--muted);margin-top:6px}
.start{margin-top:16px;background:var(--surface);border-radius:14px;padding:12px 14px;border:2px solid var(--plate)}
.start summary{font-weight:600;cursor:pointer}
.start ol{margin:8px 0 2px;padding-left:1.2em}
.start li{margin:5px 0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:16px -16px 0;padding:10px 16px;display:flex;gap:5px;border-bottom:1px solid var(--line)}
nav button{flex:1;font-size:1.2rem;padding:6px 0 4px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;cursor:pointer;line-height:1.05;min-width:0}
nav button small{display:block;font-family:"Barlow",sans-serif;font-weight:500;font-size:.66rem}
nav button.prog{border-color:var(--celeste);color:var(--celeste)}
/* La pestaña activa era un bloque blanco. Sobre fondo negro encandilaba, así que
   ahora se marca con el celeste y un relleno apenas más claro que el fondo. */
nav button[aria-selected="true"]{background:#16202A;color:var(--celeste);border-color:var(--celeste)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--celeste);outline-offset:2px}
.dayhead{margin:22px 0 12px}
.dayhead h2{font-size:2rem;margin:0;line-height:1}
.dayhead p{margin:4px 0 0;color:var(--muted)}
.dayhead .alert{color:var(--warn);font-weight:500}
.datebar{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.9rem;font-weight:500}
input[type=date],select,.field{font:inherit;font-size:.95rem;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.progress{height:6px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.list{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--surface);border-radius:14px;padding:10px 12px 12px 8px;border:1px solid var(--line);border-left:5px solid var(--celeste)}
.ex.isdone{border-left-color:var(--done)}
.top{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:start}
.fig{display:flex;flex-direction:column;align-items:center}
.ex svg{width:132px;height:104px;display:block}
.phase{font-size:.78rem;font-weight:600;color:var(--celeste);text-align:center;min-height:2.2em;line-height:1.1;margin-top:2px}
.view{font-size:.7rem;color:var(--muted)}
.ex h3{margin:0;font-size:1.05rem;font-weight:600;line-height:1.2}
.sets{font-size:1.35rem;color:var(--celeste);line-height:1.1;margin-top:2px}
.ex.isdone .sets{color:var(--done)}
.cue{margin:4px 0 6px;font-size:.9rem;color:var(--muted)}
.swap{font:inherit;font-size:.82rem;font-weight:600;color:var(--celeste);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;min-height:32px;cursor:pointer}
.swap[aria-expanded="true"]{background:var(--bg)}
.ex.swapped{border-left-color:var(--plate)}
.ex.swapped .swap{color:var(--plate);border-color:var(--plate)}
.alts{margin-top:8px;padding:8px;background:var(--bg);border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.alts[hidden]{display:none}
.alts p{margin:0 0 2px;font-size:.8rem;color:var(--muted)}
.alts button{font:inherit;font-size:.9rem;font-weight:500;text-align:left;min-height:44px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.alts button[aria-current="true"]{border-color:var(--celeste);color:var(--celeste);font-weight:600}
.alts button small{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.sess{border-top:1px solid var(--line)}
.sess summary{cursor:pointer;padding:9px 2px;font-size:.92rem;font-weight:600;min-height:44px;display:flex;align-items:center}
.sess summary small{color:var(--muted);font-weight:400;margin-left:6px}
.sess[open] summary{color:var(--celeste)}
.log{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.88rem;font-weight:500}
.log .wgt{width:84px}
.reps{display:inline-flex;gap:5px;align-items:center}
.reps input{width:40px;text-align:center;padding:6px 2px}
.field{padding:6px 6px}
.sethead{display:grid;grid-template-columns:22px 70px 14px 58px;gap:6px;margin-top:10px;font-size:.72rem;font-weight:600;color:var(--muted)}
.setlist{display:flex;flex-direction:column;gap:5px;margin-top:3px}
.setrow{display:grid;grid-template-columns:22px 70px 14px 58px auto;gap:6px;align-items:center;font-size:.88rem}
.setrow .sn{font-weight:600;color:var(--muted);text-align:center}
.setrow .x,.setrow .u{color:var(--muted);font-size:.8rem}
.setrow .field{width:100%;text-align:center;padding:7px 4px}
.last .hold{color:var(--warn);font-weight:600}
.pr{color:var(--plate);font-weight:700}
.summary{margin-top:14px}
.tips{margin:0;padding-left:1.1em}.tips li{margin:6px 0;font-size:.92rem}
.tips li.up{color:var(--done);font-weight:600}.tips li.hold{color:var(--warn);font-weight:500}
.sync.off{color:var(--warn);font-weight:500}
.last{margin-top:6px;font-size:.85rem;color:var(--muted)}
.last .up{color:var(--done);font-weight:600}
details.tech{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.tech summary{cursor:pointer;font-weight:600;font-size:.92rem}
.tech dl{margin:8px 0 0}
.tech dt{font-weight:600;font-size:.88rem;margin-top:8px}
.tech dd{margin:2px 0 0;font-size:.9rem;color:var(--muted)}
.tech dd.bad{color:var(--warn)}
.panel{background:var(--surface);border-radius:14px;padding:14px;margin-top:12px;border:1px solid var(--line)}
.panel h3{margin:0 0 8px;font-size:1.1rem}
.panel .formrow{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.panel label.stack{display:flex;flex-direction:column;font-size:.8rem;font-weight:600;color:var(--muted);gap:3px}
.panel .field{width:96px}
.btn{font:inherit;font-weight:600;font-size:.92rem;padding:8px 14px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:none;color:var(--ink)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.muted{color:var(--muted);font-size:.88rem}
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px;border:1px solid var(--line)}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;line-height:1}
.stat span{font-size:.78rem;color:var(--muted)}
.dl{display:flex;flex-wrap:wrap;gap:8px}
.msg{font-size:.85rem;margin-top:8px;color:var(--muted);min-height:1.2em}
.keys{margin-top:34px;padding-top:18px;border-top:2px solid var(--ink)}
.keys h2{font-size:1.6rem;margin:0 0 8px}
.keys ul{margin:0;padding-left:1.1em}
.keys li{margin:6px 0}
b{font-weight:600}
/* ---- iPhone: barra abajo, campos de 16px (sin zoom), toques de 44px ---- */
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.wrap{padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(170px + env(safe-area-inset-bottom,0px))}
header h1{font-size:2.4rem;margin:0}
nav{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;
  padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right));gap:6px;
  box-shadow:0 -4px 16px rgba(0,0,0,.06)}
nav button{min-height:54px;font-size:1.15rem;border-radius:12px;touch-action:manipulation}
nav button small{font-size:.62rem;white-space:nowrap}
input,select,button{font-size:16px}
select{width:100%;max-width:100%;text-overflow:ellipsis}
html,body{overflow-x:hidden;max-width:100%}
main{min-width:0}
input[type=date],select,.field{font-size:16px;min-height:44px}
.top{grid-template-columns:104px 1fr;gap:10px}
.ex svg{width:104px;height:82px}
.phase{font-size:.7rem}
.ex{padding:12px 12px 12px 10px}
.sethead,.setrow{grid-template-columns:22px 1fr 12px 1fr 48px}
.sethead.now,.setrow.now{grid-template-columns:22px 1fr 48px}
.sethead{margin-top:12px;font-size:.75rem}
.setlist{gap:8px}
.setrow .field{font-size:18px;font-weight:600;min-height:46px;border-radius:10px;padding:6px 4px;text-align:center}
.setrow .field::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.ok{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--muted);font-weight:800;font-size:20px;touch-action:manipulation;cursor:pointer}
.ok.on{background:var(--done);border-color:var(--done);color:#fff}
.ok:active,nav button:active,.btn:active{transform:scale(.96)}
.datebar input{flex:1}
.panel{border-radius:16px}
#rest{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;display:grid;grid-template-columns:1fr auto 52px 52px 44px;align-items:center;gap:8px;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);overflow:hidden;max-width:560px;margin:0 auto}
#rest[hidden]{display:none}
#rest .rinfo{display:flex;flex-direction:column;min-width:0;font-weight:600;font-size:.85rem;line-height:1.15}
#rest .rinfo small{opacity:.7;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rest b{font-family:"Barlow Condensed",sans-serif;font-size:2rem;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
#rest button{min-height:44px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:inherit;font-weight:700}
#rest i{position:absolute;left:0;bottom:0;height:4px;background:var(--celeste);width:0}
#rest.fin{background:var(--done)}
#rest.fin i{background:#fff}
@media (min-width:600px){nav{left:50%;right:auto;transform:translateX(-50%);width:600px;border-radius:16px 16px 0 0}}
@media (max-width:380px){.top{grid-template-columns:104px 1fr}.ex svg{width:104px;height:82px}nav button{font-size:1.05rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mi gym</h1>
    <div class="sync" id="sync">Cargando tu registro…</div>
  </header>

  <nav role="tablist" id="tabs"></nav>
  <main id="day"></main>
  <div id="rest" hidden role="timer" aria-live="polite"><div class="rinfo"><span>Descanso</span><small id="rname"></small></div><b id="rt">1:30</b><button type="button" data-d="-15" aria-label="Restar 15 segundos">−15</button><button type="button" data-d="15" aria-label="Sumar 15 segundos">+15</button><button type="button" data-x aria-label="Cerrar descanso">✕</button><i id="rbar"></i></div>

</div>
<script>
const EQ = {
  bench:(x1,x2,y)=>`<rect x="${x1}" y="${y}" width="${x2-x1}" height="7" rx="2" fill="var(--equip)"/><line x1="${x1+6}" y1="${y+7}" x2="${x1+6}" y2="150" stroke="var(--equip)" stroke-width="4"/><line x1="${x2-6}" y1="${y+7}" x2="${x2-6}" y2="150" stroke="var(--equip)" stroke-width="4"/>`,
  back:(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--equip)" stroke-width="7" stroke-linecap="round"/>`,
  tower:(x)=>`<line x1="${x}" y1="6" x2="${x}" y2="150" stroke="var(--equip)" stroke-width="5"/>`,
  pulley:(x,y)=>`<circle cx="${x}" cy="${y}" r="5" fill="var(--surface)" stroke="var(--equip)" stroke-width="3"/>`,
  seatF:()=>`<rect x="66" y="112" width="68" height="7" rx="2" fill="var(--equip)"/><line x1="100" y1="119" x2="100" y2="150" stroke="var(--equip)" stroke-width="4"/>`
};
const STAND={h:[100,40],n:[100,52],p:[100,95],k1:[102,122],a1:[100,150]};
const FRONT={h:[100,42],n:[100,55],p:[100,97],s1:[88,58],s2:[112,58],k1:[93,124],a1:[91,150],k2:[107,124],a2:[109,150]};
const SEATF={h:[100,50],n:[100,64],p:[100,108],s1:[86,66],s2:[114,66],k1:[84,112],a1:[84,150],k2:[116,112],a2:[116,150]};
const LYING={h:[130,99],n:[117,104],p:[72,104],k1:[46,110],a1:[42,150]};
const INCL={h:[80,58],n:[86,70],p:[108,110],k1:[140,108],a1:[146,150]};
const RESP="Soltá el aire en el esfuerzo y tomalo en la vuelta. No aguantes la respiración durante toda la serie.";

const EX={
banca:{name:"Press banca con barra",perSide:1,db:[],plate:1,hl:["torso","ua1"],equip:()=>EQ.bench(55,150,110),
  ph:[["Bajá la barra al pecho (2 s)",2000],["Empujá hacia arriba (1 s)",1000]],
  A:{...LYING,e1:[116,80],w1:[117,58]},B:{...LYING,e1:[106,120],w1:[112,98]},
  cue:"Codos a 45°, barra hasta la parte baja del pecho. El peso se anota por lado, sin contar la barra.",
  pos:"Acostado con los ojos justo debajo de la barra, pies firmes en el piso, omóplatos juntos y hacia abajo. Agarre un poco más ancho que los hombros.",
  mov:"Bajá controlado hasta rozar la parte baja del pecho, con los codos a unos 45° del cuerpo. Empujá hacia arriba y levemente hacia atrás hasta estirar los brazos.",
  err:"Abrir los codos a 90° (sobrecarga el hombro), rebotar la barra en el pecho o despegar la cola del banco.",
  resp:"Tomá aire arriba, aguantalo al bajar y soltalo al empujar."},
inclinado:{name:"Press inclinado con mancuernas",db:[1],grip:"punta",hl:["torso","ua1"],equip:()=>EQ.bench(92,136,115)+EQ.back(98,114,70,60),
  ph:[["Bajá hasta estirar el pecho (2 s)",2000],["Empujá arriba (1 s)",1000]],
  A:{...INCL,e1:[104,56],w1:[116,42]},B:{...INCL,e1:[80,96],w1:[94,80]},
  cue:"Banco a 30–45°, trabaja la parte alta del pecho.",
  pos:"Banco a 30–45°, espalda y cabeza apoyadas, pies en el piso. Mancuernas arriba del pecho con las palmas hacia adelante.",
  mov:"Bajá las mancuernas hacia los costados del pecho hasta sentir el estiramiento. Empujá hacia arriba acercándolas sin chocarlas.",
  err:"Banco muy parado (se vuelve ejercicio de hombro), arquear mucho la zona lumbar o bajar muy poco."},
aperturas:{name:"Aperturas en banco plano",db:[1,2],grip:"vertical",hl:["ua1","ua2"],view:"Vista desde arriba",pre:["3×12","7 kg c/u"],
  equip:()=>`<rect x="87" y="26" width="26" height="80" rx="4" fill="var(--equip)" opacity=".55"/>`,
  ph:[["Abrí en arco, codos fijos (2 s)",2000],["Cerrá como un abrazo (1 s)",1100]],
  A:{h:[100,30],n:[100,43],p:[100,95],s1:[86,46],s2:[114,46],k1:[91,122],a1:[89,150],k2:[109,122],a2:[111,150],e1:[80,52],w1:[94,50],e2:[120,52],w2:[106,50]},
  B:{h:[100,30],n:[100,43],p:[100,95],s1:[86,46],s2:[114,46],k1:[91,122],a1:[89,150],k2:[109,122],a2:[111,150],e1:[60,54],w1:[36,58],e2:[140,54],w2:[164,58]},
  cue:"Codos con leve flexión que no cambia: el movimiento es un abrazo.",
  pos:"Acostado en banco plano, omóplatos juntos y hacia abajo, pies firmes en el piso. Mancuernas arriba del pecho con las palmas enfrentadas y los codos apenas flexionados (unos 15 a 20°). Esa flexión queda fija todo el ejercicio.",
  mov:"Abrí los brazos en arco hacia los costados a la altura del pecho, no de la cara, con los codos apuntando hacia afuera y un poco hacia abajo. Bajá hasta que los codos queden más o menos a la altura del torso y sientas el estiramiento en el pecho. Volvé por el mismo arco pensando en juntar los codos más que las manos, y frená un poco antes de que las mancuernas se toquen para no perder tensión.",
  err:"Doblar y estirar los codos en cada repetición (se vuelve un press), bajar los codos por debajo del nivel del banco, abrir los brazos a la altura de la cara (carga el hombro) o chocar las mancuernas arriba."},
hombro:{name:"Press de hombros sentado",db:[1,2],hl:["ua1","ua2"],equip:()=>`<rect x="88" y="58" width="24" height="54" rx="3" fill="var(--equip)" opacity=".5"/>`+EQ.seatF(),
  ph:[["Empujá arriba (1 s)",1000],["Bajá a las orejas (2 s)",2000]],
  A:{...SEATF,e1:[70,76],w1:[72,54],e2:[130,76],w2:[128,54]},B:{...SEATF,e1:[80,44],w1:[88,22],e2:[120,44],w2:[112,22]},
  cue:"Espalda apoyada, sin arquear.",
  pos:"Sentado con el respaldo vertical, espalda y cola apoyadas. Mancuernas a la altura de las orejas, palmas hacia adelante.",
  mov:"Empujá hacia arriba hasta casi estirar los brazos, acercando las mancuernas sobre la cabeza. Bajá controlado hasta la altura de las orejas.",
  err:"Arquear la zona lumbar, hacer medio recorrido o llevar los codos demasiado hacia atrás."},
laterales:{name:"Elevaciones laterales",db:[1,2],grip:"punta",hl:["ua1","ua2"],
  ph:[["Subí a la altura del hombro (1 s)",1000],["Bajá lento (2 s)",2000]],
  A:{...FRONT,e1:[86,78],w1:[84,100],e2:[114,78],w2:[116,100]},B:{...FRONT,e1:[68,60],w1:[46,62],e2:[132,60],w2:[154,62]},
  cue:"Guiá el movimiento con los codos, sin impulso.",
  pos:"De pie, pies al ancho de la cadera, torso apenas inclinado hacia adelante. Mancuernas a los costados, codos levemente flexionados.",
  mov:"Subí los brazos hacia los costados, como si los codos empujaran hacia las paredes, hasta la altura de los hombros. Bajá más lento de lo que subiste.",
  err:"Balancear el cuerpo, subir más arriba de los hombros o encoger el cuello."},
pushdown:{name:"Extensión de tríceps en polea con barra recta",plate:2,hl:["fa1"],cable:[[150,12,1]],equip:()=>EQ.tower(158)+EQ.pulley(150,12),
  ph:[["Empujá hasta estirar (1 s)",1000],["Volvé controlado (2 s)",2000]],
  A:{h:[104,40],n:[102,52],p:[98,95],k1:[100,122],a1:[98,150],e1:[104,80],w1:[122,66]},B:{h:[104,40],n:[102,52],p:[98,95],k1:[100,122],a1:[98,150],e1:[104,80],w1:[108,103]},

/* Todas las repeticiones son número fijo, sin rangos: Lucas prefiere que la serie
   sea siempre la misma y los rangos tipo "15-25" le parecían un montón de reps.

   igual se progresa igual: primero se suman repeticiones de más al número fijo y
   recién cuando salen todas limpias se sube la placa.
   Las series por sesión quedan entre 14 y 17. Verificable con tools/volumen.mjs. */

/* Cada ejercicio trae su propia prescripción (series y peso sugerido) desde la rutina.
   Los que solo existen como alternativa la traen en su campo "pre". */
function listEntryOf(key){
  for(const d of DAYS)for(const e of d.list)if(e[0]===key)return e;
  const p=EX[key]&&EX[key].pre;return p?[key,p[0],p[1]]:null;
}

const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function pose(ex,t){const o={};for(const k in ex.A)o[k]=lerp(ex.A[k],ex.B[k]||ex.A[k],t);return o}
const f=v=>v.toFixed(1);
function seg(a,b,hl,w,ghost){const c=ghost?"var(--ink)":(hl?"var(--celeste)":"var(--ink)");return `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${c}" stroke-width="${w||5}" stroke-linecap="round"/>`}
/* El eje de la mancuerna cruza la palma, así que es SIEMPRE perpendicular al
   antebrazo: nunca lo prolonga. Por eso el eje se deduce del brazo y rota con él.
   El agarre solo decide cómo se ve ese eje desde donde miramos:
     (sin grip) perpendicular al antebrazo, dentro del plano del dibujo (agarre neutro de perfil)
     "vertical" paralelo al eje del cuerpo (agarre neutro visto desde arriba, o sostenida de punta)
     "punta"    el eje apunta a la cámara, se ve un solo disco (agarre pronado o supinado de perfil) */

    const boxes=[...el.querySelectorAll(".rp")],wbox=[...el.querySelectorAll(".sw")],oks=[...el.querySelectorAll(".ok")];

    const prEl=el.querySelector(".pr");
    const paint=()=>{const dn=isDone();el.className="ex"+(dn?" isdone":"")+(swapped?" swapped":"");doneFlags[i]=dn;
      boxes.forEach((b,j)=>oks[j].classList.toggle("on",b.value.trim()!==""));
      const cur=doc.ex[key];const pr=hasW&&cur&&filled(cur.r)&&isPR(key,CUR_DATE,cur);prEl.hidden=!pr;PRS[i]=pr?ex.name:null;upd()};

/* Historial: cada entrenamiento entero, del más nuevo al más viejo. */
function sessionList(ws){
  if(!ws.length)return `<p class="muted">Todavía no hay entrenamientos registrados.</p>`;
  return ws.slice().reverse().map(w=>{
    const keys=Object.keys(w.ex||{}).filter(k=>filled(w.ex[k].r));
    let sets=0;keys.forEach(k=>(w.ex[k].r||[]).forEach(r=>{if(num(r)!==null)sets++}));
    const d=DAYS.find(x=>x.id===w.day);
    return `<details class="sess"><summary>${fmt(w.date)} · ${d?esc(d.name):esc(w.day)}<small>· ${d?esc(d.tag)+" · ":""}${keys.length} ejercicio${keys.length===1?"":"s"} · ${sets} serie${sets===1?"":"s"}</small></summary>
      <div class="tablewrap"><table><tbody>${keys.map(k=>`<tr><td>${esc(EX[k]?EX[k].name:k)}</td><td>${esc(setsTxt(w.ex[k]))}</td></tr>`).join("")}</tbody></table></div></details>`;
  }).join("");
}

function lineChart(pts,unit){
  if(!pts.length)return `<p class="muted">Todavía no hay datos. Aparecen a medida que registrás.</p>`;
  const W=320,H=150,pl=36,pr=14,pt=14,pb=24;
  let mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));
  if(mn===mx){mn-=1;mx+=1}const pd=(mx-mn)*.15;mn-=pd;mx+=pd;
  const x=i=>pts.length===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(pts.length-1);
  const y=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución">`;
  for(let g=0;g<3;g++){const v=mn+(mx-mn)*(g/2),yy=y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-5}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(v*10)/10}</text>`}
  s+=`<polyline fill="none" stroke="var(--celeste)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p,i)=>x(i)+","+y(p.v)).join(" ")}"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="var(--celeste)"/>`});
  s+=`<text x="${x(0)}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="${pts.length===1?"middle":"start"}">${fmt(pts[0].d)}</text>`;
  if(pts.length>1)s+=`<text x="${x(pts.length-1)}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${fmt(pts[pts.length-1].d)}</text>`;
  const lp=pts[pts.length-1];s+=`<text x="${Math.min(x(pts.length-1),W-pr)}" y="${y(lp.v)-8}" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="end">${lp.v} ${unit}</text>`;
  return s+"</svg>";
}

}

/* ---------- descargas ---------- */
const MIME={html:"text/html;charset=utf-8",csv:"text/csv;charset=utf-8",json:"application/json"};
function offer(filename,data,m){
  try{
    const ext=filename.split(".").pop();
    const url=URL.createObjectURL(new Blob([data],{type:MIME[ext]||"text/plain;charset=utf-8"}));
    const a=document.createElement("a");a.href=url;a.download=filename;a.rel="noopener";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    if(m)m.textContent="Archivo generado. Buscalo en tus descargas o elegí dónde guardarlo.";
  }catch(e){if(m)m.textContent="No se pudo generar el archivo: "+(e&&e.message||e)}
}
function csv(){
  const rows=[["tipo","fecha","dia","ejercicio","peso_max","series_peso_x_reps","peso_corporal_kg","cintura_cm"]];
  for(const w of workouts())for(const k in (w.ex||{})){const e=w.ex[k];if(filled(e.r))rows.push(["entrenamiento",w.date,dayName(w.day),EX[k]?EX[k].name:k,topW(e)??"",setsTxt(e),"",""])}
  const body=(MEM.body&&MEM.body.items)||{};
  Object.keys(body).sort().forEach(d=>rows.push(["medicion",d,"","","","",body[d].peso||"",body[d].cintura||""]));
  const q=v=>{v=String(v??"");return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return "\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n");
}

/* ---------- respaldo ---------- */
function backupJSON(){
  return JSON.stringify({app:"mi-gym",version:1,exportado:new Date().toISOString(),datos:MEM},null,1);
}
/* Nunca pisa lo que ya tenés: solo agrega lo que falta. */
function restoreBackup(text){
  const b=JSON.parse(text);
  const datos=b&&b.app==="mi-gym"&&b.datos?b.datos:b;
  if(!datos||typeof datos!=="object")throw new Error("no tiene datos adentro");
  if(!Object.keys(datos).some(k=>k==="body"||k.startsWith("w_")))throw new Error("no hay entrenamientos ni mediciones adentro");
  let nuevos=0,existentes=0,cambio=false;
  for(const id in datos){
    const inc=datos[id];if(!inc||typeof inc!=="object")continue;
    if(id==="body"){
      const cur=MEM.body?clone(MEM.body):{items:{}};if(!cur.items)cur.items={};
      for(const d in (inc.items||{}))if(!cur.items[d]){cur.items[d]=inc.items[d];cambio=true}
      if(cambio)saveDoc("body",cur);
      continue;
    }
    if(!id.startsWith("w_")){if(!(id in MEM)){saveDoc(id,inc);cambio=true}continue}
    if(!(id in MEM)){saveDoc(id,inc);nuevos++;cambio=true;continue}
    existentes++;
    const cur=clone(MEM[id]);if(!cur.ex)cur.ex={};
    let sum=false;
    for(const k in (inc.ex||{}))if(!cur.ex[k]||!filled(cur.ex[k].r)){cur.ex[k]=inc.ex[k];sum=true}
    if(sum){saveDoc(id,cur);cambio=true}
  }
  if(cambio)LS.set("ultimo-backup",todayStr());
  updSync();
  return{nuevos,existentes};
}

/* ---------- arranque ---------- */
DAYS.forEach(d=>{const b=document.createElement("button");b.type="button";b.setAttribute("role","tab");b.dataset.id=d.id;b.innerHTML=`${d.short}<small>${d.tag}</small>`;b.setAttribute("aria-label",`${d.name}, ${d.tag}`);b.addEventListener("click",()=>{safe(()=>showDay(d.id));window.scrollTo({top:0})});tabs.appendChild(b)});
{const b=document.createElement("button");b.type="button";b.className="prog";b.setAttribute("role","tab");b.dataset.id="prog";b.innerHTML=`Prog.<small>Registro</small>`;b.setAttribute("aria-label","Progreso y registro");b.addEventListener("click",()=>{safe(showProgress);window.scrollTo({top:0})});tabs.appendChild(b)}
const wd=new Date().getDay();
function safe(fn){try{fn()}catch(e){dayEl.innerHTML=`<section class="panel"><h3>No se pudo mostrar esta pantalla</h3><p class="muted">Tocá otro día arriba o recargá la página. Si sigue pasando, contale a Claude este error: ${esc(e&&e.message||e)}</p></section>`}}
applySeeds();
safe(()=>{if(wd>=1&&wd<=5)showDay(DAYS[wd-1].id);else showProgress()});
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(!reduce){let lastT=0;(function tick(now){
  if(!document.hidden&&now-lastT>=33){lastT=now;
    for(const c of cards){if(!c.vis)continue;try{const[t,p]=state(c.ex,now);c.svg.innerHTML=draw(c.ex,t);if(p!==c.last){c.ph.textContent=c.ex.ph[p][0];c.last=p}}catch(e){c.vis=false}}}
  requestAnimationFrame(tick)})(performance.now())}
</script>
</body>
</html>
