<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi gym</title>
<meta name="description" content="Registro de entrenamiento y seguimiento de progreso.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi gym">
<!-- black-translucent y no default: con "default" iOS dibuja una barra de estado clara
     arriba de todo, y sobre una app de fondo negro queda una franja blanca fea justo
     al lado del Dynamic Island. Con esto el negro sigue hasta el borde y la hora y la
     batería salen en blanco. Funciona porque :root lleva padding-top con
     env(safe-area-inset-top), que es lo que impide que el contenido se meta abajo
     del notch. Si alguna vez se saca ese padding, hay que volver a "default". -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link href="fonts.css" rel="stylesheet">
<style>
/* ============================================================
   Mi gym — hoja de estilo
   Escrita para un iPhone sostenido con una mano, en un gimnasio
   con luz fuerte, entre serie y serie. Todo lo demás es secundario.

   Tres reglas que explican casi todas las decisiones de abajo:
   1. Fondo negro de verdad (#000). La pantalla es OLED: el negro no
      gasta batería, y con luz fuerte las tarjetas se recortan mejor.
   2. Nada que se toque mide menos de 44 px. Con la mano transpirada
      y apurado, un botón chico es un botón errado.
   3. Los campos van en 16 px o más. Abajo de eso iOS hace zoom solo
      al tocarlos y te descoloca la pantalla entera.
   ============================================================ */
:root{
  /* Sobre negro puro una tarjeta gris oscuro casi no se despega del
     fondo, así que --surface está más arriba de lo que parece, lleva
     un degradado muy suave y además borde. Medido contra el fondo da
     poco contraste a propósito (la tarjeta no tiene que gritar), pero
     todo el TEXTO de adentro pasa 5:1 contra su propia tarjeta. */
  --bg:#000000;
  --surface:#13191F;     /* tarjetas y paneles */
  --surface2:#1B232B;    /* campos y huecos dentro de una tarjeta */
  --ink:#EAF0F6;
  --muted:#8E9AA6;
  --line:#28313B;
  --equip:#4C5661;       /* bancos, torres y poleas de los dibujos */
  --celeste:#5AA9F0;     /* el acento: lo que falta hacer */
  --plate:#E0A33F;       /* récords y ejercicios cambiados */
  --done:#35C27E;        /* lo hecho */
  --warn:#E8834A;
  /* Una sola escala de redondeo para todo. Mezclar radios al azar es
     lo que más hace que una pantalla parezca improvisada. */
  --r1:10px; --r2:14px; --r3:20px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{overflow-x:hidden;max-width:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;
}
main{min-width:0}
b{font-weight:600}
/* La condensada es para números y títulos: ocupa menos y se lee de
   lejos, que es como mirás el teléfono apoyado en el piso. */
h1,h2,h3,.sets,.stat b,nav button,#rest b,.badge,.count{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(180px + env(safe-area-inset-bottom,0px))}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--celeste);outline-offset:2px}

/* ---------- encabezado de la app ----------
   Era un bloque enorme con el nombre gigante y un subtítulo. En el
   gimnasio no necesitás que te recuerden cómo se llama la app: la
   abriste vos. Queda en una línea y el día empieza arriba de todo. */
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px}
/* El nombre no se parte nunca: cuando el aviso de respaldo es largo,
   el que se achica y envuelve es el aviso, no el título. */
header h1{flex:0 0 auto;white-space:nowrap;font-size:1.15rem;font-weight:800;margin:0;letter-spacing:.02em;color:var(--muted);text-transform:uppercase}
.sync{flex:1 1 auto;min-width:0;font-size:.74rem;color:var(--muted);text-align:right;line-height:1.25}
/* El aviso de "bajá un respaldo" es lo único de toda la app que grita,
   y grita a propósito: es lo único que no se puede deshacer. */
.sync.off{color:var(--warn);font-weight:600}

/* ---------- cabecera del día ----------
   Estaba todo pegado contra la izquierda y la pantalla parecía un
   formulario de oficina. El día es el titular: va centrado, con el
   tipo de sesión arriba en chico y los músculos abajo. Tres tamaños
   bien distintos, que es lo que hace que algo se lea como diseñado
   y no como una lista de campos. */
.dayhead{margin:0 0 16px;text-align:center}
.kicker{margin:0 0 3px;font-size:.72rem;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--celeste)}
.dayhead h2{font-size:2.4rem;font-weight:800;margin:0;line-height:.98;letter-spacing:-.01em}
.dayhead .focus{margin:4px auto 0;color:var(--muted);font-size:.9rem;line-height:1.3;max-width:30ch}
.dayhead input[type=date]{display:block;margin:11px auto 0;width:auto;min-height:44px;font-size:15px;padding:4px 10px}
/* Barra de avance del día. Antes era una línea de 6 px que no se veía
   contra el fondo; ahora lleva número al lado, que es el dato real. */
.dhbar{display:flex;align-items:center;gap:10px;margin-top:12px}
.progress{flex:1;height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;width:0;border-radius:999px;background:var(--done);transition:width .35s ease}
.count{font-size:1.05rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.count.full{color:var(--done)}
/* La nota del día es un párrafo largo que se lee una vez y después
   estorba todos los días siguientes. Va plegada. */
.note{margin-top:10px;border:1px solid var(--line);border-radius:var(--r1);background:var(--surface);overflow:hidden}
.note summary{cursor:pointer;padding:9px 12px;font-size:.86rem;font-weight:600;color:var(--celeste);min-height:40px;display:flex;align-items:center}
.note[open] summary{border-bottom:1px solid var(--line)}
.note p{margin:0;padding:10px 12px;font-size:.88rem;color:var(--muted)}
.note p.alert{color:var(--warn)}

/* ---------- tarjeta de ejercicio ---------- */
.list{display:flex;flex-direction:column;gap:12px}
.ex{
  background:linear-gradient(180deg,#161D25 0%,#11171E 100%);
  border:1px solid var(--line);border-radius:var(--r3);
  padding:14px 12px 12px;
}
.ex.isdone{border-color:#23463A;background:linear-gradient(180deg,#121E1A 0%,#0E1714 100%)}
.ex.swapped{border-color:#4A3A1E}
.top{display:grid;grid-template-columns:116px 1fr;gap:12px;align-items:start}
/* El dibujo vive en su propio recuadro. Suelto sobre la tarjeta
   parecía un error de carga; con marco se lee como ilustración. */
.fig{background:var(--surface2);border-radius:var(--r2);padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center}
.ex svg{width:104px;height:82px;display:block}
.view{font-size:.66rem;color:var(--muted);line-height:1}
.phase{font-size:.68rem;font-weight:600;color:var(--celeste);text-align:center;min-height:2.5em;line-height:1.18;margin-top:3px;text-wrap:balance}
.ex.isdone .phase{color:var(--done)}
.exmeta{display:flex;align-items:center;gap:8px;margin-bottom:3px}
/* El número de ejercicio contesta "¿cuánto me falta?" sin contar
   tarjetas hacia abajo. */
.badge{flex:0 0 auto;width:24px;height:24px;border-radius:999px;background:var(--surface2);color:var(--muted);
  font-size:.95rem;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.ex.isdone .badge{background:var(--done);color:#06120D}
.sets{font-size:1.5rem;font-weight:800;color:var(--celeste);line-height:1}
.ex.isdone .sets{color:var(--done)}
.ex h3{margin:0;font-size:1.2rem;font-weight:700;line-height:1.15;letter-spacing:.005em}
.cue{margin:5px 0 8px;font-size:.88rem;color:var(--muted);line-height:1.35}
.swap{font:inherit;font-size:.82rem;font-weight:600;color:var(--celeste);background:var(--surface2);
  border:1px solid var(--line);border-radius:999px;padding:0 15px;min-height:44px;cursor:pointer;touch-action:manipulation}
.swap[aria-expanded="true"]{background:var(--bg)}
.ex.swapped .swap{color:var(--plate);border-color:var(--plate)}
.alts{margin-top:10px;padding:10px;background:var(--bg);border-radius:var(--r2);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.alts[hidden]{display:none}
.alts p{margin:0 0 2px;font-size:.8rem;color:var(--muted)}
.alts button{font:inherit;font-size:.92rem;font-weight:500;text-align:left;min-height:48px;padding:8px 12px;
  border-radius:var(--r1);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.alts button[aria-current="true"]{border-color:var(--celeste);color:var(--celeste);font-weight:600}
.alts button small{display:block;font-size:.78rem;color:var(--muted);font-weight:400}

/* ---------- carga de series ----------
   Acá es donde se gana o se pierde. Antes había que abrir el teclado
   para cambiar un peso: tocar el campo, esperar el teclado, borrar,
   escribir, cerrar. Ahora cada número tiene − y + al lado y el teclado
   queda para los casos raros. El campo sigue siendo escribible. */
.sethead{display:grid;grid-template-columns:18px 1fr 1fr 48px;gap:6px;margin-top:14px;
  font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sethead.now{grid-template-columns:18px 1fr 48px}
.sethead span{text-align:center}
.setlist{display:flex;flex-direction:column;gap:7px;margin-top:5px}
.setrow{display:grid;grid-template-columns:18px 1fr 1fr 48px;gap:6px;align-items:center}
.setrow.now{grid-template-columns:18px 1fr 48px}
.setrow .sn{font-weight:700;color:var(--muted);text-align:center;font-size:.82rem}
.stepper{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;
  background:var(--surface2);border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;min-height:48px}
.stepper:focus-within{border-color:var(--celeste)}
.st{font:inherit;font-size:20px;font-weight:700;line-height:1;color:var(--muted);background:none;border:0;
  height:46px;cursor:pointer;touch-action:manipulation;padding:0}
.st:active{background:rgba(255,255,255,.08);color:var(--ink)}
.stepper .field{width:100%;min-width:0;border:0;background:none;text-align:center;
  font-size:18px;font-weight:700;padding:0;min-height:46px;color:var(--ink);border-radius:0}
.stepper .field::placeholder{color:var(--muted);opacity:.5;font-weight:600}
.ok{min-height:48px;border-radius:var(--r1);border:1px solid var(--line);background:var(--surface2);
  color:var(--muted);font-weight:800;font-size:20px;touch-action:manipulation;cursor:pointer;padding:0}
.ok.on{background:var(--done);border-color:var(--done);color:#06120D}
.ok:active,nav button:active,.btn:active,.rep:active{transform:scale(.96)}
/* Un toque y queda cargado todo el ejercicio igual que la última vez.
   Es el camino rápido para el día que repetís sin cambios, que es la
   mayoría de los días. */
.rep{display:block;width:100%;margin-top:9px;min-height:44px;font:inherit;font-size:.9rem;font-weight:700;
  color:var(--celeste);background:var(--surface2);border:1px dashed var(--line);border-radius:var(--r1);
  cursor:pointer;touch-action:manipulation}
.rep[hidden]{display:none}
.last{margin-top:9px;font-size:.84rem;color:var(--muted);line-height:1.35}
.last .up{color:var(--done);font-weight:600}
.last .hold{color:var(--warn);font-weight:600}
.pr{color:var(--plate);font-weight:700}
details.tech{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
details.tech summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted);min-height:36px;display:flex;align-items:center}
details.tech[open] summary{color:var(--celeste)}
.tech dl{margin:6px 0 0}
.tech dt{font-weight:700;font-size:.84rem;margin-top:9px;color:var(--ink)}
.tech dd{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
.tech dd.bad{color:var(--warn)}

/* ---------- paneles, resumen y progreso ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:16px;margin-top:14px}
.panel h3{margin:0 0 10px;font-size:1.25rem;font-weight:700}
.panel .formrow{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.panel label.stack{display:flex;flex-direction:column;font-size:.78rem;font-weight:700;color:var(--muted);gap:4px;text-transform:uppercase;letter-spacing:.03em}
.panel .field{width:104px}
.summary{margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:var(--r2);padding:10px;border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:1.9rem;font-weight:800;line-height:1;color:var(--ink)}
.stat span{font-size:.74rem;color:var(--muted);line-height:1.2;display:block;margin-top:3px}
input[type=date],select,.field{font:inherit;font-size:16px;min-height:48px;padding:8px 10px;
  border:1px solid var(--line);border-radius:var(--r1);background:var(--surface2);color:var(--ink)}
select{width:100%;max-width:100%;text-overflow:ellipsis}
.btn{font:inherit;font-weight:700;font-size:.95rem;min-height:48px;padding:0 18px;border-radius:var(--r1);
  border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;touch-action:manipulation}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.dl{display:flex;flex-wrap:wrap;gap:8px}
.msg{font-size:.85rem;margin-top:8px;color:var(--muted);min-height:1.2em}
.muted{color:var(--muted);font-size:.88rem}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--muted)}
.sess{border-top:1px solid var(--line)}
.sess summary{cursor:pointer;padding:10px 2px;font-size:.92rem;font-weight:600;min-height:48px;display:flex;align-items:center;flex-wrap:wrap}
.sess summary small{color:var(--muted);font-weight:400;margin-left:6px}
.sess[open] summary{color:var(--celeste)}
.tips{margin:0;padding-left:1.1em}
.tips li{margin:7px 0;font-size:.92rem}
.tips li.up{color:var(--done);font-weight:600}
.tips li.hold{color:var(--warn);font-weight:500}
.keys{margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.keys h2{font-size:1.4rem;margin:0 0 8px}
.keys ul{margin:0;padding-left:1.1em}
.keys li{margin:6px 0}
/* Qué versión tenés puesta. Sirve para confirmar de un vistazo que un
   cambio recién subido te llegó de verdad al teléfono. */
.ver{margin:22px 0 0;text-align:center;font-size:.74rem;color:var(--muted);opacity:.8}

/* ---------- barra de días, abajo ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;
  background:rgba(10,13,17,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right))}
nav button{flex:1;min-width:0;min-height:54px;font-size:1.15rem;font-weight:700;line-height:1.05;
  border:1px solid transparent;background:none;color:var(--muted);border-radius:var(--r2);cursor:pointer;touch-action:manipulation}
nav button small{display:block;font-family:"Barlow",sans-serif;font-weight:500;font-size:.62rem;white-space:nowrap;opacity:.85}
nav button.prog{color:var(--celeste)}
/* El día que estás mirando se marca con relleno, no con un bloque
   blanco: sobre fondo negro el blanco encandila de noche. */
nav button[aria-selected="true"]{background:#16222E;color:var(--celeste);border-color:#27485F}
/* Un punto verde arriba del día significa "este día ya lo entrenaste". */
nav button.hecho{position:relative}
nav button.hecho::after{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:999px;background:var(--done)}

/* ---------- cronómetro de descanso ---------- */
#rest{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:21;
  display:grid;grid-template-columns:1fr auto 52px 52px 44px;align-items:center;gap:8px;
  background:var(--ink);color:#0A0E12;border-radius:var(--r3);padding:10px 12px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden;max-width:560px;margin:0 auto}
#rest[hidden]{display:none}
#rest .rinfo{display:flex;flex-direction:column;min-width:0;font-weight:700;font-size:.85rem;line-height:1.15}
#rest .rinfo small{opacity:.7;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rest b{font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
#rest button{min-height:44px;border-radius:var(--r1);border:0;background:rgba(0,0,0,.12);color:inherit;font-weight:700;font:inherit;font-size:.95rem;cursor:pointer}
#rest i{position:absolute;left:0;bottom:0;height:4px;background:var(--celeste);width:0}
#rest.fin{background:var(--done)}
#rest.fin i{background:#fff}

/* ============================================================
   Movimiento
   Todo corto (180–340 ms) y nada que trabe: en el gimnasio, entre
   serie y serie, una animación lenta es una animación molesta. La
   idea no es decorar, es que se entienda qué cambió — qué tarjeta
   acaba de darse por hecha, qué número subió.
   Si tenés activado "Reducir movimiento" en el iPhone, se apaga todo
   solo (el bloque del final).
   ============================================================ */
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes subirPanel{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* Las tarjetas entran una atrás de otra, muy corrido. Da la sensación
   de que la lista se arma, en vez de aparecer de golpe. */
.ex{animation:subir .34s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i,0) * 40ms);
  transition:border-color .35s ease,background .35s ease}
#day{animation:aparecer .22s ease both}
.ok{transition:background .2s ease,border-color .2s ease,color .2s ease,transform .1s ease}
/* El ✓ pega un salto al prenderse: es la confirmación de que quedó
   anotado, sin tener que leer nada. */
.ok.on{animation:pop .3s ease}
.badge{transition:background .35s ease,color .35s ease}
.count{display:inline-block;transition:color .3s ease}
.count.bump{animation:pop .38s ease}
.progress span{transition:width .45s cubic-bezier(.2,.7,.3,1)}
nav button{transition:background .2s ease,color .2s ease,border-color .2s ease,transform .1s ease}
nav button.hecho::after{animation:pop .4s ease}
.swap,.btn,.rep,.st,.alts button{transition:background .18s ease,color .18s ease,border-color .18s ease,transform .1s ease}
#rest{animation:subirPanel .26s cubic-bezier(.2,.7,.3,1) both}
.note[open] p,.tech[open] dl{animation:aparecer .26s ease both}
.alts:not([hidden]){animation:subir .22s cubic-bezier(.2,.7,.3,1) both}
.panel{animation:subir .3s cubic-bezier(.2,.7,.3,1) both}

@media (min-width:600px){
  nav{left:50%;right:auto;transform:translateX(-50%);width:600px;border-radius:var(--r3) var(--r3) 0 0}
}
/* Pantallas angostas (iPhone mini o SE): el dibujo se achica para que
   el nombre del ejercicio no quede cortado en tres renglones. */
@media (max-width:370px){
  .top{grid-template-columns:96px 1fr;gap:9px}
  .ex svg{width:86px;height:68px}
  .stepper{grid-template-columns:30px 1fr 30px}
  nav button{font-size:1.02rem}
}
/* Las tarjetas entran con retardo escalonado. Si no anulo también el
   retardo, con "Reducir movimiento" quedarían invisibles un rato
   antes de aparecer de golpe, que es peor que la animación. */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mi gym</h1>
    <div class="sync" id="sync">Cargando tu registro…</div>
  </header>
  <!-- El nombre de la app y el estado del respaldo van en una sola línea
       arriba de todo. Antes el título ocupaba media pantalla y empujaba
       el primer ejercicio abajo del borde. -->

  <nav role="tablist" id="tabs"></nav>

/* Todas las repeticiones son número fijo, sin rangos: Lucas prefiere que la serie
   sea siempre la misma y los rangos tipo "15-25" le parecían un montón de reps.
   Donde subir de peso es un salto enorme (polea de placa 1 a placa 2 es el doble)
   igual se progresa igual: primero se suman repeticiones de más al número fijo y
   recién cuando salen todas limpias se sube la placa.
   Los cinco días quedan en 20 series exactas. Verificable con tools/volumen.mjs. */

/* ===== Por qué esta rutina y no la anterior (noviembre 2026) =====
   Hasta octubre Lucas jugaba al fútbol, y por eso el plan tenía UN día de piernas:
   la cancha ya le daba el estímulo y el gimnasio solo tenía que no estorbar. Eso
   estaba escrito tal cual en los objetivos de tools/volumen.mjs ("piernas en
   mantenimiento mientras juegue al fútbol").
   Se terminó el fútbol y ese razonamiento se venció: quedaron unas piernas en
   mantenimiento sin nada que las mantuviera, mientras todo el tren superior
   seguía entrenándose dos veces por semana.
   Arreglarlo metiendo más series el miércoles no servía: ese día ya estaba en 20
   series, que es el techo de una sesión de dos horas. Las piernas necesitaban un
   segundo día, así que la semana pasó de 4 torso + 1 pierna a 3 torso + 2 pierna.
   Lunes y jueves están separados por tres días a propósito: es la distancia justa
   para entrenar la pierna dos veces sin llegar dolorido a la segunda.
   Lo que se paga: el torso baja de 91,5 a 86,5 series fraccionales (un 5%) y
   varios grupos quedan en el piso de su rango en vez de en el medio. Es una

const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;

/* El eje de la mancuerna cruza la palma, así que es SIEMPRE perpendicular al
   antebrazo: nunca lo prolonga. Por eso el eje se deduce del brazo y rota con él.
   El agarre solo decide cómo se ve ese eje desde donde miramos:
     (sin grip) perpendicular al antebrazo, dentro del plano del dibujo (agarre neutro de perfil)
     "vertical" paralelo al eje del cuerpo (agarre neutro visto desde arriba, o sostenida de punta)
     "punta"    el eje apunta a la cámara, se ve un solo disco (agarre pronado o supinado de perfil) */
function gripDir(ex,e,w){
  if(ex.grip==="vertical")return[0,1];
  return[-(w[1]-e[1]),w[0]-e[0]];
}
function dumbbell(p,dir){
  const[x,y]=p,m=Math.hypot(dir[0],dir[1])||1,dx=dir[0]/m,dy=dir[1]/m,px=-dy,py=dx;
  const ln=(a,b,w)=>`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="var(--plate)" stroke-width="${w}" stroke-linecap="round"/>`;
  const end=t=>[x+dx*7*t,y+dy*7*t];
  const disco=c=>ln([c[0]-px*5,c[1]-py*5],[c[0]+px*5,c[1]+py*5],4);
  return ln(end(-1),end(1),3)+disco(end(-1))+disco(end(1));
}
const discoDePunta=p=>`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="5.5" fill="none" stroke="var(--plate)" stroke-width="3.5"/>`;

  s+=seg(P.p,k2,H("th2"),5,ghost)+seg(k2,a2,H("sh2"),5,ghost);
  if(P.s1)s+=seg(P.s1,P.s2,false,5,ghost);
  if(P.e2)s+=seg(s2,P.e2,H("ua2"),5,ghost)+seg(P.e2,P.w2,H("fa2"),5,ghost);
  s+=seg(P.n,P.p,H("torso"),7,ghost)+seg(P.p,P.k1,H("th1"),5,ghost)+seg(P.k1,P.a1,H("sh1"),5,ghost);
  if(P.t1)s+=seg(P.a1,P.t1,false,4,ghost);
  s+=seg(s1,P.e1,H("ua1"),5,ghost)+seg(P.e1,P.w1,H("fa1"),5,ghost);
  s+=`<circle cx="${f(P.h[0])}" cy="${f(P.h[1])}" r="9" fill="var(--ink)"/>`;
  return s}
function draw(ex,t){
  const P=pose(ex,t);
  let s=`<line x1="4" y1="150.5" x2="196" y2="150.5" stroke="var(--line)" stroke-width="2"/>`;
  if(ex.equip)s+=ex.equip();
  s+=`<g opacity=".13">${body(ex,pose(ex,1),true)}</g>`;
  let mid=null;if(ex.bar&&P.w2)mid=[(P.w1[0]+P.w2[0])/2,(P.w1[1]+P.w2[1])/2];
  if(ex.cable)for(const[x,y,to]of ex.cable){const g=to==="bar"?mid:(to===2?P.w2:P.w1);s+=`<line x1="${x}" y1="${y}" x2="${f(g[0])}" y2="${f(g[1])}" stroke="var(--celeste)" stroke-width="2" stroke-dasharray="4 3" opacity=".8"/>`}
  s+=body(ex,P,false);
  if(ex.bar&&P.w2)s+=`<line x1="${f(P.w1[0]-10)}" y1="${f(P.w1[1])}" x2="${f(P.w2[0]+10)}" y2="${f(P.w2[1])}" stroke="var(--plate)" stroke-width="4" stroke-linecap="round"/>`;
  if(ex.plate===1)s+=`<circle cx="${f(P.w1[0])}" cy="${f(P.w1[1])}" r="10" fill="none" stroke="var(--plate)" stroke-width="4"/><circle cx="${f(P.w1[0])}" cy="${f(P.w1[1])}" r="2.5" fill="var(--plate)"/>`;
  if(ex.plate===2)s+=`<circle cx="${f(P.w1[0])}" cy="${f(P.w1[1])}" r="4.5" fill="var(--plate)"/>`;
  if(ex.db){
    const mancuerna=(w,e)=>ex.grip==="punta"?discoDePunta(w):dumbbell(w,gripDir(ex,e,w));
    if(ex.db.includes(1))s+=mancuerna(P.w1,P.e1);

  if(r.length>=Math.min(3,S.n)&&r.every(v=>v!==null&&v>=S.target))return{c:"up",t:`Hoy subí ${UNIT[key]==="lado"?"1,25 kg por lado":UNIT[key]==="placa"?"una placa":"a la mancuerna siguiente"}.`};

  return{c:"hold",t:"Mantené el peso y buscá 1 repetición más por serie."};
}
function isPR(key,date,e){const t=topW(e);if(t===null)return false;const prev=history(key).filter(x=>x.date<date).map(x=>topW(x.e)).filter(v=>v!==null);return prev.length>0&&t>Math.max(...prev)}
function lastSess(key){const h=history(key);return h[h.length-1]||null}
function setsOf(key){for(const d of DAYS)for(const[k,s,sg]of d.list)if(k===key)return[parseSets(s),sg!==""];return[parseSets("1×1"),false]}
const TIPS=["Proteína: apuntá a 140–160 g por día, repartida en todas las comidas.","Dormí 7 a 8 horas: el músculo se construye descansando.","Bajada lenta (2–3 s) en cada repetición: es donde más se estimula el músculo.","Descanso entre series: 60–90 s en brazos, hasta 2 min en press banca y piernas.","Caminá todos los días, domingo incluido: suma al déficit sin cansarte.","Si algo duele en una articulación (no el ardor del músculo), bajá el peso."];
function tips(ws,wkStr,body,bDates){
  const out=[];
  const n7=ws.filter(w=>w.date>=wkStr).length;
  if(!ws.length)out.push({c:"",t:"Todavía no hay entrenamientos registrados. Empezá anotando tu próxima sesión."});
  else if(n7>=5)out.push({c:"up",t:`${n7} entrenamientos en los últimos 7 días: semana completa.`});
  else out.push({c:n7<3?"hold":"",t:`${n7} de 5 entrenamientos en los últimos 7 días.`});
  const ready=[],stuck=[];
  for(const k of exerciseKeys()){
    const[S,hasW]=setsOf(k);const h=history(k);if(!h.length||!hasW||S.timed)continue;
    const a=advice(k,h[h.length-1].e,S,hasW);if(a&&a.c==="up")ready.push(EX[k].name);
    if(h.length>=3){const l=h.slice(-3),tw=l.map(x=>topW(x.e)),tr=l.map(x=>x.r.reduce((s,v)=>s+(num(v)||0),0));
      if(tw[0]===tw[1]&&tw[1]===tw[2]&&tr[2]<=tr[0])stuck.push(EX[k].name)}
  }
  if(ready.length)out.push({c:"up",t:`Listos para subir de peso: ${ready.join(", ")}.`});
  if(stuck.length)out.push({c:"hold",t:`Sin avances en 3 sesiones: ${stuck.join(", ")}. Bajá un 10% el peso una semana y volvé a subir.`});
  const lastD=bDates[bDates.length-1];
  if(!lastD||(new Date(todayStr())-new Date(lastD))/864e5>=7)out.push({c:"hold",t:"Toca registrar peso y cintura (abajo)."});
  const pts=bDates.filter(d=>num(body[d].peso)!==null);
  if(pts.length>=2){const d0=pts[0],d1=pts[pts.length-1],days=(new Date(d1)-new Date(d0))/864e5;
    if(days>=7){const rate=(num(body[d1].peso)-num(body[d0].peso))/(days/7);
      if(rate<-1)out.push({c:"hold",t:"Bajás más de 1 kg por semana: sumá algo de comida para no perder músculo."});
      else if(rate>0.3)out.push({c:"hold",t:"El peso viene subiendo: revisá permitidos y picoteo nocturno."})}}
  const cw=bDates.filter(d=>num(body[d].cintura)!==null);
  if(cw.length>=2){const dc=num(body[cw[cw.length-1]].cintura)-num(body[cw[0]].cintura);if(dc<0)out.push({c:"up",t:`La cintura bajó ${String(Math.round(-dc*10)/10).replace(".",",")} cm desde que empezaste: vas bien.`})}
  out.push({c:"",t:TIPS[Math.floor(new Date()/864e5)%TIPS.length]});
  return out;
}
function records(){
  const rows=[];
  for(const k of exerciseKeys()){let best=null,bd="",bs="";for(const x of history(k)){const t=topW(x.e);if(t!==null&&(best===null||t>best)){best=t;bd=x.date;bs=x.e}}
    if(best!==null){const j=(bs.r||[]).findIndex((r,i)=>r!==""&&num(setW(bs,i))===best);rows.push([EX[k].name,setW(bs,j)+(/[a-z]/i.test(setW(bs,j))?"":unitShort(k)),bs.r[j],bd])}}
  return rows;
}

function beep(sec){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  if(OSC){try{OSC.stop()}catch(e){}}const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);
  const t=AC.currentTime+Math.max(0,sec);g.gain.setValueAtTime(0,AC.currentTime);[0,.28,.56].forEach(d=>{g.gain.setValueAtTime(.22,t+d);g.gain.setValueAtTime(0,t+d+.16)});

function tickRest(){if(!REST_END)return;const left=Math.ceil((REST_END-Date.now())/1000);
  if(left<=0){rtEl.textContent="¡Dale!";restEl.classList.add("fin");rbar.style.width="100%";REST_END=0;REST_HIDE=setTimeout(()=>{restEl.hidden=true},6000);return}

  if(b.dataset.x!==undefined){stopRest();return}

  const doc=MEM[docId]?clone(MEM[docId]):{date:CUR_DATE,day:d.id,ex:{}};
  if(!doc.ex)doc.ex={};
  /* La cabecera del día: nombre y músculos a la izquierda, fecha como
     chip a la derecha, avance en una barra con el número al lado, y la

  dayEl.innerHTML=`<div class="dayhead">

  /* qué ejercicio ocupa hoy cada lugar de la rutina, contando los que cambiaste.

     apuntando a un ejercicio que después borré, o a uno que ahora está en otro
     lugar del mismo día (y aparecería dos veces, pisando el mismo registro).
     En los dos casos se ignora el cambio y vuelve el de la rutina. Sin esto el
     día entero moría con "No se pudo mostrar esta pantalla". */
  const efectivos=d.list.map(([k])=>{
    const s=doc.alt&&doc.alt[k];

  });
  d.list.forEach(([origKey,origSets,origSug],i)=>{
    /* si cambiaste este ejercicio hoy, se registra bajo el ejercicio que realmente hiciste */
    const key=efectivos[i],swapped=key!==origKey;
    const le=swapped?listEntryOf(key):null;
    const sets=le?le[1]:origSets,sug=le?le[2]:origSug;
    const ex=EX[key],S=parseSets(sets),entry=doc.ex[key]||{};
    const prev=lastBefore(key,CUR_DATE);
    const hasW=sug!=="";
    /* Nada se repite dos veces en el mismo día. Un lugar de la rutina queda tomado
       tanto por su ejercicio original como por el que lo esté reemplazando hoy:
       si ofreciera cualquiera de los dos, el ejercicio aparecería dos veces y las

    const ocupados=new Set();

    const puedeVolver=!ocupados.has(origKey);
    const base=entry.w!=null&&entry.w!==""?entry.w:(lastWeight(key)||sug);
    const reps=Array.from({length:S.n},(_,j)=>(entry.r||[])[j]||"");
    const clean=v=>String(v??"").replace(/^placa\s*/i,"").replace(/\s*(kg|c\/u|por lado).*$/i,"").trim();
    const ws=Array.from({length:S.n},(_,j)=>{const v=entry.ws&&entry.ws[j];return clean(v!=null&&v!==""?v:base)});
    let lastTxt="";
    if(prev){
      const a=advice(key,prev.e,S,hasW);
      lastTxt=`Última vez (${fmt(prev.date)}): ${esc(setsTxt(prev.e))}${a?`<br><span class="${a.c}">${a.t}</span>`:""}`;
    /* "arrancá con sin peso" no se puede leer: los ejercicios de peso corporal
       llevan su propia frase. */
    }else lastTxt=hasW?(/^sin peso$/i.test(String(sug||"").trim())?"Primera vez: es con tu propio peso, anotá solo las repeticiones.":`Primera vez: arrancá con ${esc(sug)}.`):"";
    /* Cuánto suma o resta cada toque de + y −. El salto depende de con
       qué estés cargando: en barra el disco más chico que hay cambia
       1,25 kg de cada lado, en polea no existe media placa, y en
       mancuernas el salto real del gimnasio es de a 1 kg. */
    const STEP=UNIT[key]==="lado"?1.25:1;
    const nice=n=>{const r=Math.round(n*100)/100;return String(r).replace(".",",")};
    const rows=reps.map((v,j)=>`<div class="setrow${hasW?"":" now"}"><span class="sn">${j+1}</span>${hasW?`<div class="stepper"><button type="button" class="st" data-f="w" data-d="-1" aria-label="Bajar peso serie ${j+1}" tabindex="-1">−</button><input class="field sw" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${esc(ws[j])}" aria-label="Peso serie ${j+1}"><button type="button" class="st" data-f="w" data-d="1" aria-label="Subir peso serie ${j+1}" tabindex="-1">+</button></div>`:""}<div class="stepper"><button type="button" class="st" data-f="r" data-d="-1" aria-label="Bajar repeticiones serie ${j+1}" tabindex="-1">−</button><input class="field rp" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off" value="${esc(v)}" placeholder="${S.timed?"60":S.target}" aria-label="${S.timed?"Segundos":"Repeticiones"} serie ${j+1}"><button type="button" class="st" data-f="r" data-d="1" aria-label="Subir repeticiones serie ${j+1}" tabindex="-1">+</button></div><button type="button" class="ok" aria-label="Serie ${j+1} hecha">✓</button></div>`).join("");

      ${opciones.map(([ak,why])=>`<button type="button" data-k="${ak}" aria-current="${key===ak?"true":"false"}">${esc(EX[ak].name)}<small>${esc(why)}</small></button>`).join("")}</div>`:"";
    el.innerHTML=`<div class="top"><div class="fig"><svg viewBox="0 0 200 158" role="img" aria-label="Animación de ${ex.name}"></svg>${ex.view?`<span class="view">${ex.view}</span>`:""}<div class="phase" aria-hidden="true"></div></div>
      <div><div class="exmeta"><span class="badge">${i+1}</span><span class="sets">${sets}</span></div><h3>${ex.name}</h3><p class="cue">${ex.cue}</p>${altBtn}</div></div>
      ${altOpts}
      <div class="sethead${hasW?"":" now"}"><span></span>${hasW?`<span>${unitLabel(key)}</span>`:""}<span>${S.timed?"Segundos":"Reps"}</span><span></span></div>
      <div class="setlist">${rows}</div>
      <button type="button" class="rep" hidden></button>
      <div class="last">${lastTxt}<span class="pr" hidden> · Récord</span></div>
      <details class="tech"><summary>Técnica</summary><dl>
      <dt>Posición inicial</dt><dd>${ex.pos}</dd><dt>Movimiento</dt><dd>${ex.mov}</dd>
      <dt>Errores comunes</dt><dd class="bad">${ex.err}</dd><dt>Respiración</dt><dd>${ex.resp||RESP}</dd></dl></details>`;
    const boxes=[...el.querySelectorAll(".rp")],wbox=[...el.querySelectorAll(".sw")],oks=[...el.querySelectorAll(".ok")];
    const isDone=()=>boxes.every(b=>b.value.trim()!=="");
    const prEl=el.querySelector(".pr");
    const paint=()=>{const dn=isDone();el.className="ex"+(dn?" isdone":"")+(swapped?" swapped":"");doneFlags[i]=dn;
      boxes.forEach((b,j)=>oks[j].classList.toggle("on",b.value.trim()!==""));
      const cur=doc.ex[key];const pr=hasW&&cur&&filled(cur.r)&&isPR(key,CUR_DATE,cur);prEl.hidden=!pr;PRS[i]=pr?ex.name:null;upd()};
    const save=()=>{

      if(filled(r)||(entry.r&&filled(entry.r))){

    const repBtn=el.querySelector(".rep");
    if(prev&&!filled(entry.r)){

        if(hasW)wbox.forEach((b,j)=>{const w=clean(setW(prev.e,j));if(w)b.value=w});

      });
    }
    if(hayCambio){
      const sw=el.querySelector(".swap"),panel=el.querySelector(".alts");

      });

    const card={svg,ph,ex,last:-1,vis:false};cards.push(card);if(IO){svg.__card=card;IO.observe(svg)}else card.vis=true;
    svg.innerHTML=draw(ex,reduce?1:0);

  });
}

/* Historial: cada entrenamiento entero, del más nuevo al más viejo. */
function sessionList(ws){
  if(!ws.length)return `<p class="muted">Todavía no hay entrenamientos registrados.</p>`;
  return ws.slice().reverse().map(w=>{
    const keys=Object.keys(w.ex||{}).filter(k=>filled(w.ex[k].r));
    let sets=0;keys.forEach(k=>(w.ex[k].r||[]).forEach(r=>{if(num(r)!==null)sets++}));
    const d=DAYS.find(x=>x.id===w.day);
    return `<details class="sess"><summary>${fmt(w.date)} · ${d?esc(d.name):esc(w.day)}<small>· ${d?esc(d.tag)+" · ":""}${keys.length} ejercicio${keys.length===1?"":"s"} · ${sets} serie${sets===1?"":"s"}</small></summary>
      <div class="tablewrap"><table><tbody>${keys.map(k=>`<tr><td>${esc(EX[k]?EX[k].name:k)}</td><td>${esc(setsTxt(w.ex[k]))}</td></tr>`).join("")}</tbody></table></div></details>`;
  }).join("");
}

function lineChart(pts,unit){
  if(!pts.length)return `<p class="muted">Todavía no hay datos. Aparecen a medida que registrás.</p>`;
  const W=320,H=150,pl=36,pr=14,pt=14,pb=24;
  let mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));
  if(mn===mx){mn-=1;mx+=1}const pd=(mx-mn)*.15;mn-=pd;mx+=pd;
  const x=i=>pts.length===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(pts.length-1);
  const y=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución">`;
  for(let g=0;g<3;g++){const v=mn+(mx-mn)*(g/2),yy=y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-5}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(v*10)/10}</text>`}
  s+=`<polyline fill="none" stroke="var(--celeste)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p,i)=>x(i)+","+y(p.v)).join(" ")}"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="var(--celeste)"/>`});
  s+=`<text x="${x(0)}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="${pts.length===1?"middle":"start"}">${fmt(pts[0].d)}</text>`;
  if(pts.length>1)s+=`<text x="${x(pts.length-1)}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${fmt(pts[pts.length-1].d)}</text>`;
  const lp=pts[pts.length-1];s+=`<text x="${Math.min(x(pts.length-1),W-pr)}" y="${y(lp.v)-8}" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="end">${lp.v} ${unit}</text>`;
  return s+"</svg>";
}

/* La rutina primero; los que solo existen como alternativa aparecen cuando los usaste. */
function exerciseKeys(){
  const seen=[];DAYS.forEach(d=>d.list.forEach(([k])=>{if(!seen.includes(k))seen.push(k)}));
  for(const w of workouts())for(const k in (w.ex||{}))if(EX[k]&&!seen.includes(k)&&filled(w.ex[k].r))seen.push(k);
  return seen;
}

/* ---------- descargas ---------- */
const MIME={html:"text/html;charset=utf-8",csv:"text/csv;charset=utf-8",json:"application/json"};
function offer(filename,data,m){
  try{
    const ext=filename.split(".").pop();
    const url=URL.createObjectURL(new Blob([data],{type:MIME[ext]||"text/plain;charset=utf-8"}));
    const a=document.createElement("a");a.href=url;a.download=filename;a.rel="noopener";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    if(m)m.textContent="Archivo generado. Buscalo en tus descargas o elegí dónde guardarlo.";
  }catch(e){if(m)m.textContent="No se pudo generar el archivo: "+(e&&e.message||e)}
}
function csv(){
  const rows=[["tipo","fecha","dia","ejercicio","peso_max","series_peso_x_reps","peso_corporal_kg","cintura_cm"]];
  for(const w of workouts())for(const k in (w.ex||{})){const e=w.ex[k];if(filled(e.r))rows.push(["entrenamiento",w.date,dayName(w.day),EX[k]?EX[k].name:k,topW(e)??"",setsTxt(e),"",""])}
  const body=(MEM.body&&MEM.body.items)||{};
  Object.keys(body).sort().forEach(d=>rows.push(["medicion",d,"","","","",body[d].peso||"",body[d].cintura||""]));
  const q=v=>{v=String(v??"");return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return "\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n");
}

/* ---------- respaldo ---------- */
function backupJSON(){
  return JSON.stringify({app:"mi-gym",version:1,exportado:new Date().toISOString(),datos:MEM},null,1);
}
/* Nunca pisa lo que ya tenés: solo agrega lo que falta. */
function restoreBackup(text){
  const b=JSON.parse(text);
  const datos=b&&b.app==="mi-gym"&&b.datos?b.datos:b;
  if(!datos||typeof datos!=="object")throw new Error("no tiene datos adentro");
  if(!Object.keys(datos).some(k=>k==="body"||k.startsWith("w_")))throw new Error("no hay entrenamientos ni mediciones adentro");
  let nuevos=0,existentes=0,cambio=false;
  for(const id in datos){
    const inc=datos[id];if(!inc||typeof inc!=="object")continue;
    if(id==="body"){
      const cur=MEM.body?clone(MEM.body):{items:{}};if(!cur.items)cur.items={};
      for(const d in (inc.items||{}))if(!cur.items[d]){cur.items[d]=inc.items[d];cambio=true}
      if(cambio)saveDoc("body",cur);
      continue;
    }
    if(!id.startsWith("w_")){if(!(id in MEM)){saveDoc(id,inc);cambio=true}continue}
    if(!(id in MEM)){saveDoc(id,inc);nuevos++;cambio=true;continue}
    existentes++;
    const cur=clone(MEM[id]);if(!cur.ex)cur.ex={};
    let sum=false;
    for(const k in (inc.ex||{}))if(!cur.ex[k]||!filled(cur.ex[k].r)){cur.ex[k]=inc.ex[k];sum=true}
    if(sum){saveDoc(id,cur);cambio=true}
  }
  if(cambio)LS.set("ultimo-backup",todayStr());
  updSync();
  return{nuevos,existentes};
}

  return `<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rutina de 3 meses</title>
<style>:root{--bg:#fff;--surface:#fff;--ink:#1E2833;--muted:#5D6B79;--line:#C9CFD6;--equip:#9AA6B2;--celeste:#2F86D1;--plate:#D99A2B;--warn:#B8561F}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);max-width:760px;margin:0 auto;padding:20px;line-height:1.4}
h1{font-size:2rem;margin:0 0 4px}h2{margin:28px 0 8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
article{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);break-inside:avoid}
.figs{display:flex;gap:4px}.figs svg{width:98px;height:78px}h3{margin:0;font-size:1.05rem}.s{color:var(--celeste);font-weight:700;margin:2px 0 6px}
p{margin:4px 0;font-size:.9rem}.bad{color:var(--warn)}.intro{color:var(--muted)}
@media(max-width:520px){article{grid-template-columns:1fr}}</style></head><body>
<h1>Mi gym</h1><p class="intro">Cada ejercicio muestra la posición inicial y final. Bajada lenta (2 a 3 segundos), subida controlada (1 segundo). Descanso de 60 a 90 segundos entre series, hasta 2 minutos en press banca y en los ejercicios principales de pierna. Nada de cinta: los 10.000 pasos diarios ya son el cardio de la semana.</p>
${groups.map(([t,l])=>`<h2>${t}</h2>${l.map(exHTML).join("")}`).join("")}
</body></html>`;
}

/* ---------- versión ----------
   Sirve para una sola cosa, pero importante: confirmar de un vistazo
   que un cambio recién subido llegó de verdad al teléfono, en vez de
   confiar en que llegó. Si abrís la app y el número no cambió, el
   cambio todavía no bajó.
   ATENCIÓN: este número y el VERSION de sw.js van juntos. Si tocás
   index.html hay que subir los dos. */
const APP_VER="10", APP_FECHA="2 nov 2026";
/* Un punto verde arriba del día = ese día ya lo entrenaste esta semana.
   Contesta "¿el martes ya lo hice?" sin entrar a mirar. */
function marcarDiasHechos(){
  const hoy=new Date(CUR_DATE+"T12:00:00"),lun=new Date(hoy);
  lun.setDate(hoy.getDate()-((hoy.getDay()+6)%7));
  const hechos=new Set();
  for(const w of workouts()){
    const f=new Date(w.date+"T12:00:00"),dif=(f-lun)/86400000;
    if(dif>=0&&dif<7&&Object.keys(w.ex||{}).some(k=>filled(w.ex[k].r)))hechos.add(w.day);
  }
  tabs.querySelectorAll("button[data-id]").forEach(b=>b.classList.toggle("hecho",hechos.has(b.dataset.id)));
}

/* ---------- arranque ---------- */
DAYS.forEach(d=>{const b=document.createElement("button");b.type="button";b.setAttribute("role","tab");b.dataset.id=d.id;b.innerHTML=`${d.short}<small>${d.tag}</small>`;b.setAttribute("aria-label",`${d.name}, ${d.tag}`);b.addEventListener("click",()=>{safe(()=>showDay(d.id));window.scrollTo({top:0})});tabs.appendChild(b)});
{const b=document.createElement("button");b.type="button";b.className="prog";b.setAttribute("role","tab");b.dataset.id="prog";b.innerHTML=`Prog.<small>Registro</small>`;b.setAttribute("aria-label","Progreso y registro");b.addEventListener("click",()=>{safe(showProgress);window.scrollTo({top:0})});tabs.appendChild(b)}
const wd=new Date().getDay();
function safe(fn){try{fn()}catch(e){dayEl.innerHTML=`<section class="panel"><h3>No se pudo mostrar esta pantalla</h3><p class="muted">Tocá otro día arriba o recargá la página. Si sigue pasando, contale a Claude este error: ${esc(e&&e.message||e)}</p></section>`}}
applySeeds();
document.getElementById("ver").textContent=`Versión ${APP_VER} · ${APP_FECHA}`;
safe(()=>{if(wd>=1&&wd<=5)showDay(DAYS[wd-1].id);else showProgress()});
safe(marcarDiasHechos);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(!reduce){let lastT=0;(function tick(now){
  if(!document.hidden&&now-lastT>=33){lastT=now;
    for(const c of cards){if(!c.vis)continue;try{const[t,p]=state(c.ex,now);c.svg.innerHTML=draw(c.ex,t);if(p!==c.last){c.ph.textContent=faseTxt(c.ex.ph[p][0]);c.last=p}}catch(e){c.vis=false}}}
  requestAnimationFrame(tick)})(performance.now())}
</script>
